    <!-- Theme boot. Runs before first paint and before the CSS is applied, so
         the stored theme is already on <html> and the page never flashes the
         wrong one. Deliberately inline and synchronous: a deferred script would
         paint light first. Kept in step with src/hooks/useTheme.js — same key,
         same allowed values. -->
    <script>
      (function () {
        try {
          var KEY = 'rn-theme';
          var ALLOWED = ['light', 'dark', 'night'];
          var stored = null;
          try { stored = localStorage.getItem(KEY); } catch (e) { /* blocked storage */ }
          var theme = ALLOWED.indexOf(stored) > -1
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
